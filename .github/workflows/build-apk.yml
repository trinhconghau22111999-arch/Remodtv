name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.5.3"
  NDK_VERSION: "25.1.8937393"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK / NDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2" "ndk;${NDK_VERSION}"
          # androiddeployqt tự chọn platform mới nhất (android-36) -> aapt2 33.0.2 không đọc được.
          # Chỉ giữ android-33 để build dùng đúng platform.
          find "$ANDROID_HOME/platforms" -mindepth 1 -maxdepth 1 ! -name "android-33" -exec rm -rf {} +
          ls "$ANDROID_HOME/platforms"

      # Qt 6 cross-compile cho Android cần cả bản Qt desktop (host) lẫn bản Android
      - name: Install Qt (host, desktop)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          cache: true

      - name: Save host Qt path
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt (Android arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/${NDK_VERSION}" \
            -DCMAKE_BUILD_TYPE=Debug

      # Debug => APK được ký debug tự động, cài được ngay trên điện thoại
      - name: Build APK
        run: |
          set -o pipefail
          cmake --build build-android --target apk 2>&1 | tee build.log || {
            echo "::error title=Build APK failed::$(grep -n -i -E 'error|failed|exception|went wrong|not found|cannot|undefined' build.log | head -c 3500 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }

      - name: Locate and rename APK
        run: |
          APK_PATH=$(find build-android -name "*.apk" | head -1)
          echo "Found APK: $APK_PATH"
          NEW_NAME="TVRemote-v1.0-${GITHUB_SHA::7}.apk"
          cp "$APK_PATH" "$NEW_NAME"
          echo "APK_NAME=$NEW_NAME" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVRemote-APK
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "TV Remote v1.0.${{ github.run_number }}"
          files: ${{ env.APK_NAME }}
